wspring.application.name=swes_crud

logging.level.root=INFO
logging.level.com.michaelhope=INFO
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Runtime profile toggle:
# Leave empty to use the normal platform-thread configuration.
# Change to "virtual" to load application-virtual.properties and enable virtual threads.
spring.profiles.active=

spring.datasource.url=jdbc:postgresql://localhost:5332/software_engineer
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Bounded in-process cache for immutable engineer-by-ID response DTOs.
# Writes explicitly refresh/evict entries; expiry is a safety net.
app.cache.engineer-by-id.maximum-size=500
app.cache.engineer-by-id.expire-after-write=10m

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=engineer-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.michaelhope.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.michaelhope.event.SoftwareEngineerEvent
